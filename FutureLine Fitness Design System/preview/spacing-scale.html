<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body><div class="card">
<div style="display:flex; gap:16px; align-items:flex-end;">
  <div style="display:flex; align-items:flex-end; gap:4px;"><div style="width:16px; height:4px; background:var(--fl-primary); border-radius:2px;"></div><span style="font-size:11px; color:var(--fl-fg-muted);">1 · 4px</span></div>
  <div style="display:flex; align-items:flex-end; gap:4px;"><div style="width:16px; height:8px; background:var(--fl-primary); border-radius:2px;"></div><span style="font-size:11px; color:var(--fl-fg-muted);">2 · 8</span></div>
  <div style="display:flex; align-items:flex-end; gap:4px;"><div style="width:16px; height:12px; background:var(--fl-primary); border-radius:2px;"></div><span style="font-size:11px; color:var(--fl-fg-muted);">3 · 12</span></div>
  <div style="display:flex; align-items:flex-end; gap:4px;"><div style="width:16px; height:16px; background:var(--fl-primary); border-radius:2px;"></div><span style="font-size:11px; color:var(--fl-fg-muted);">4 · 16</span></div>
  <div style="display:flex; align-items:flex-end; gap:4px;"><div style="width:16px; height:24px; background:var(--fl-primary); border-radius:2px;"></div><span style="font-size:11px; color:var(--fl-fg-muted);">6 · 24 ★</span></div>
  <div style="display:flex; align-items:flex-end; gap:4px;"><div style="width:16px; height:32px; background:var(--fl-primary); border-radius:2px;"></div><span style="font-size:11px; color:var(--fl-fg-muted);">8 · 32</span></div>
</div>
<div style="font-size:11px; color:var(--fl-fg-muted); margin-top:18px;">★ space-y-6 is the default section rhythm; inside cards use space-y-3</div>
</div></body></html>
