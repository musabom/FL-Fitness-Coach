<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body><div class="card">
<div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:12px;">
  <div>
    <div style="height:80px; border-radius:12px; background:#2DD4BF; box-shadow: 0 0 24px rgba(45,212,191,0.3);"></div>
    <div style="font-size:12px; font-weight:600; margin-top:8px;">primary</div>
    <div style="font-size:11px; color:var(--fl-fg-muted);">#2DD4BF teal</div>
  </div>
  <div>
    <div style="height:80px; border-radius:12px; background:rgba(45,212,191,0.1); border:1px solid rgba(45,212,191,0.2);"></div>
    <div style="font-size:12px; font-weight:600; margin-top:8px;">primary/10</div>
    <div style="font-size:11px; color:var(--fl-fg-muted);">soft wash</div>
  </div>
  <div>
    <div style="height:80px; border-radius:12px; background:rgba(45,212,191,0.05); border:1px solid rgba(45,212,191,0.4);"></div>
    <div style="font-size:12px; font-weight:600; margin-top:8px;">tinted border</div>
    <div style="font-size:11px; color:var(--fl-fg-muted);">primary/40</div>
  </div>
  <div>
    <div style="height:80px; border-radius:12px; background:#081025; color:#2DD4BF; display:flex; align-items:center; justify-content:center; font-weight:700;">Aa</div>
    <div style="font-size:12px; font-weight:600; margin-top:8px;">primary-fg</div>
    <div style="font-size:11px; color:var(--fl-fg-muted);">#081025</div>
  </div>
</div>
</div></body></html>
