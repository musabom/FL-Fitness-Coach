<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body><div class="card">
<div style="display:flex; gap:12px; flex-wrap:wrap;">

  <button style="height:56px; padding:0 32px; background:#2DD4BF; color:#081025; border:none; border-radius:16px; font-weight:500; font-size:18px; cursor:pointer;">Large</button>
  <button style="height:48px; width:48px; background:#0F1F3D; color:#F0F6FF; border:1px solid #1B3260; border-radius:12px; cursor:pointer;">⎈</button>
</div>
