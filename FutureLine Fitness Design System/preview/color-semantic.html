<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body><div class="card">
<div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:12px;">
  <div>
    <div style="height:70px; border-radius:12px; background:#EF4444;"></div>
    <div style="font-size:12px; font-weight:600; margin-top:8px;">destructive</div>
    <div style="font-size:11px; color:var(--fl-fg-muted);">#EF4444</div>
  </div>
  <div>
    <div style="height:70px; border-radius:12px; background:#F59E0B;"></div>
    <div style="font-size:12px; font-weight:600; margin-top:8px;">warning</div>
    <div style="font-size:11px; color:var(--fl-fg-muted);">#F59E0B</div>
  </div>
  <div>
    <div style="height:70px; border-radius:12px; background:#22C55E;"></div>
    <div style="font-size:12px; font-weight:600; margin-top:8px;">success</div>
    <div style="font-size:11px; color:var(--fl-fg-muted);">#22C55E</div>
  </div>
  <div>
    <div style="height:70px; border-radius:12px; background:#3B82F6;"></div>
    <div style="font-size:12px; font-weight:600; margin-top:8px;">info</div>
    <div style="font-size:11px; color:var(--fl-fg-muted);">#3B82F6</div>
  </div>
</div>
</div></body></html>
