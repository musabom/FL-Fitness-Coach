<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body><div class="card">
<div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
  <div style="background:#0F1F3D; height:100px; border-radius:24px; box-shadow: 0 10px 30px -12px rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--fl-fg-muted);">card · shadow-xl shadow-black/20</div>
  <div style="background:#0F1F3D; height:100px; border-radius:16px; box-shadow: 0 0 20px rgba(45,212,191,0.3); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--fl-primary); border:1px solid rgba(45,212,191,0.5);">primary glow · teal ring</div>
  <div style="background:#0F1F3D; height:100px; border-radius:24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--fl-fg-muted);">modal · shadow-2xl</div>
  <div style="background:#0F1F3D; height:100px; border-radius:24px; border:1px solid var(--fl-border); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--fl-fg-muted);">flat · no shadow (default)</div>
</div>
</div></body></html>
