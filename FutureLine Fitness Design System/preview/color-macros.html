<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body><div class="card">
<div style="background:#0F1F3D; padding:20px; border-radius:16px;">
  <div style="font-size:10px; font-weight:600; letter-spacing:0.15em; text-transform:uppercase; color:var(--fl-fg-muted); margin-bottom:14px;">Macro Palette (In Use)</div>
  <div style="display:flex; flex-direction:column; gap:12px;">
    <div>
      <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;"><span style="color:#F0F6FF; font-weight:600;">Protein</span><span style="color:var(--fl-fg-muted);">140 / 165 g</span></div>
      <div style="height:8px; background:rgba(255,255,255,0.08); border-radius:999px; overflow:hidden;"><div style="width:85%; height:100%; background:#3B82F6;"></div></div>
    </div>
    <div>
      <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;"><span style="color:#F0F6FF; font-weight:600;">Carbs</span><span style="color:var(--fl-fg-muted);">220 / 280 g</span></div>
      <div style="height:8px; background:rgba(255,255,255,0.08); border-radius:999px; overflow:hidden;"><div style="width:78%; height:100%; background:#F59E0B;"></div></div>
    </div>
    <div>
      <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;"><span style="color:#F0F6FF; font-weight:600;">Fat</span><span style="color:var(--fl-fg-muted);">55 / 72 g</span></div>
      <div style="height:8px; background:rgba(255,255,255,0.08); border-radius:999px; overflow:hidden;"><div style="width:76%; height:100%; background:#EAB308;"></div></div>
    </div>
    <div>
      <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;"><span style="color:#F0F6FF; font-weight:600;">Burn</span><span style="color:var(--fl-fg-muted);">485 kcal</span></div>
      <div style="height:8px; background:rgba(255,255,255,0.08); border-radius:999px; overflow:hidden;"><div style="width:60%; height:100%; background:#F97316;"></div></div>
    </div>
  </div>
</div>
</div></body></html>
