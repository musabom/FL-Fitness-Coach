<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body><div class="card">
<div style="background:#0F1F3D; border-radius:24px; padding:20px; box-shadow:0 10px 30px -12px rgba(0,0,0,0.4);">
  <div style="font-size:10px; font-weight:600; letter-spacing:0.15em; text-transform:uppercase; color:var(--fl-fg-muted); margin-bottom:14px;">Am I On Track?</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap:8px; font-size:11px; color:var(--fl-fg-muted); font-weight:600; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px;">
    <div></div><div style="text-align:center;">Consumed</div><div style="text-align:center;">Target</div><div style="text-align:center;">Var</div>
  </div>
  <div style="display:grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap:8px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:13px;">
    <div style="color:var(--fl-fg-muted); font-weight:600; font-size:12px;">Calories</div>
    <div style="text-align:center; font-weight:700;">2120<span style="color:var(--fl-fg-muted); font-size:10px;"> kcal</span></div>
    <div style="text-align:center; font-weight:700;">2450<span style="color:var(--fl-fg-muted); font-size:10px;"> kcal</span></div>
    <div style="text-align:center; font-weight:700; color:#EF4444;">−330</div>
  </div>
  <div style="display:grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap:8px; padding:10px 0; font-size:13px;">
    <div style="color:var(--fl-fg-muted); font-weight:600; font-size:12px;">Protein</div>
    <div style="text-align:center; font-weight:700;">168<span style="color:var(--fl-fg-muted); font-size:10px;"> g</span></div>
    <div style="text-align:center; font-weight:700;">165<span style="color:var(--fl-fg-muted); font-size:10px;"> g</span></div>
    <div style="text-align:center; font-weight:700; color:#22C55E;">+3g</div>
  </div>
</div>
</div></body></html>
