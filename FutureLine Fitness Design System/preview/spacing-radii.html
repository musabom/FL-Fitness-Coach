<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body><div class="card">
<div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:12px; align-items:end;">
  <div><div style="height:16px; width:16px; background:var(--fl-primary); border-radius:4px;"></div><div style="font-size:11px; margin-top:6px;">sm · 4</div></div>
  <div><div style="height:24px; width:24px; background:var(--fl-primary); border-radius:8px;"></div><div style="font-size:11px; margin-top:6px;">md · 8</div></div>
  <div><div style="height:40px; width:40px; background:var(--fl-primary); border-radius:12px;"></div><div style="font-size:11px; margin-top:6px;">lg · 12</div></div>
  <div><div style="height:56px; width:56px; background:var(--fl-primary); border-radius:16px;"></div><div style="font-size:11px; margin-top:6px;">xl · 16</div></div>
  <div><div style="height:72px; width:72px; background:var(--fl-primary); border-radius:24px;"></div><div style="font-size:11px; margin-top:6px;">2xl · 24 ★</div></div>
</div>
<div style="font-size:11px; color:var(--fl-fg-muted); margin-top:14px;">★ Default card radius — used on every surface card</div>
</div></body></html>
